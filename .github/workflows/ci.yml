name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - name: Repair native media tools
        if: matrix.node == 24
        run: node bin/smop.js doctorfix --json
      - name: Check real media preparation
        if: matrix.node == 24
        run: npm run test:media
      - name: Check installed package and missing dependency repair
        if: matrix.node == 24
        run: npm run check:package
